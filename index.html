<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekatavarakauppa POS - Visuaalinen Päivitys</title>
    <style>
        :root {
            --bg-dark: #333333;
            --pos-bg: #e0e0e0;
            --receipt-bg: #ffffff;
            --btn-green: #27ae60;
            --btn-grey: #7f8c8d;
            --btn-red: #e74c3c;
            --btn-blue: #2980b9;
            --btn-dark-grey: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tablet-tyylinen kehys kuten kuvassa */
        .pos-container {
            width: 95vw;
            height: 90vh;
            background-color: #000;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #222;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px 5px 0 0;
            display: flex;
            justify-content: space-between;
        }

        .main-layout {
            display: flex;
            flex: 1;
            background-color: #f0f0f0;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        /* VASEN PUOLI: KUITTI */
        .receipt-section {
            flex: 1.2;
            background: var(--receipt-bg);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .receipt-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .receipt-header {
            margin-bottom: 20px;
            line-height: 1.4;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            border-bottom: 2px solid #333;
            padding: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            padding: 10px 5px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        .voided {
            text-decoration: line-through;
            color: #bbb;
        }

        .age-info {
            font-size: 10px;
            color: #888;
            display: block;
        }

        .total-banner {
            background-color: #1a3a5a;
            color: white;
            padding: 20px;
            font-size: 36px;
            text-align: right;
            font-weight: bold;
        }

        /* OIKEA PUOLI: NÄPPÄIMISTÖ */
        .input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-display {
            background: white;
            border: 4px solid #2980b9;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .main-display h2 {
            margin: 0;
            font-size: 32px;
            color: #1a3a5a;
        }

        .main-display input {
            width: 100%;
            border: none;
            font-size: 32px;
            text-align: center;
            outline: none;
            margin-top: 10px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 5px;
            color: white;
            padding: 20px 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px #00000033;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #00000033;
        }

        .btn-green { background-color: var(--btn-green); }
        .btn-grey { background-color: var(--btn-grey); }
        .btn-red { background-color: var(--btn-red); }
        .btn-blue { background-color: var(--btn-blue); }
        .btn-dark { background-color: var(--btn-dark-grey); }

        .logo-area {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-top: 20px;
        }

        .logo-text {
            font-weight: bold;
            color: #1a3a5a;
            font-size: 18px;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

<div class="pos-container">
    <header>
        <span>SEKATAVARAKAUPPA POS</span>
        <span id="clock">12:00:00</span>
    </header>

    <div class="main-layout">
        <!-- Kuittinäkymä -->
        <div class="receipt-section">
            <div class="receipt-content">
                <div class="receipt-header">
                    <strong>Asiakas: <span id="member-name">Perusasiakas</span></strong><br>
                    <strong>Myyjä: Pääkäyttäjä</strong>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50%;">Tuote</th>
                            <th style="text-align: center;">Kpl</th>
                            <th style="text-align: right;">Hinta</th>
                            <th style="text-align: right;">Yht</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Tuotteet generoituu tähän -->
                    </tbody>
                </table>
            </div>
            <div class="total-banner">
                YHTEENSÄ: <span id="total-val">0.00</span> €
            </div>
        </div>

        <!-- Hallinta ja Näppäimet -->
        <div class="input-section">
            <div class="main-display">
                <h2>Viivakoodi tai määä*koodi (F3)</h2>
                <input type="text" id="main-input" autofocus placeholder="Syötä koodi...">
            </div>

            <div class="button-grid">
                <button class="btn btn-green" onclick="pay('KÄTEINEN')">KÄTEINEN (F9)</button>
                <button class="btn btn-green" onclick="pay('KORTTI')">KORTTI (F10)</button>
                <button class="btn btn-grey" onclick="addProd('1001')">MUOVIKASSI (F4)</button>
                
                <button class="btn btn-grey">KUITTI</button>
                <button class="btn btn-grey" onclick="memberSearch()">JÄSENHAKU (F7)</button>
                <button class="btn btn-green">LAHJAKORTTI</button>
                
                <button class="btn btn-red" onclick="removeLine()">POISTA RIVI (DEL)</button>
                <button class="btn btn-grey">MITÖI KUITTI</button>
                <button class="btn btn-grey">MYY LAHJAKORTTI</button>
                
                <button class="btn btn-blue" onclick="applyDiscount()">ALENNUS %</button>
                <button class="btn btn-blue">HINNANMUUTOS</button>
                <button class="btn btn-grey" onclick="toggleAdmin()">RAPORTIT</button>

                <button class="btn btn-red" style="grid-column: span 1;" onclick="voidSale()">MITÖI KUITTI</button>
            </div>

            <div class="logo-area">
                <div class="logo-text">🛒 SEKATAVARAKAUPPA</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Tietokantatestit
    let products = {
        "1001": { name: "Muovikassi", price: 0.25, age: 0 },
        "641000": { name: "Maito 1L", price: 1.15, age: 0 },
        "2002": { name: "Olut III", price: 2.50, age: 18 },
        "3003": { name: "Kahvi Juhla Mokka", price: 4.50, age: 0 }
    };

    let cart = [
        { name: "Maito 1L", qty: 1, price: 1.15, voided: false, age: 0 },
        { name: "Olut III", qty: 2, price: 2.50, voided: false, age: 18 },
        { name: "Pappagalle", qty: 1, price: 0.00, voided: true, age: 0 },
        { name: "Kahvi Juhla Mokka (-10%)", qty: 1, price: 4.05, voided: false, age: 0 }
    ];

    function updateCart() {
        const tbody = document.getElementById('cart-items');
        tbody.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            const tr = document.createElement('tr');
            if (item.voided) tr.className = 'voided';
            
            const lineTotal = item.voided ? 0 : (item.price * item.qty);
            if (!item.voided) total += lineTotal;

            tr.innerHTML = `
                <td>
                    ${item.name}
                    ${item.age > 0 ? '<span class="age-info">ⓘ IKÄRAJATARKISTUS: OK</span>' : ''}
                </td>
                <td style="text-align: center;">${item.qty}</td>
                <td style="text-align: right;">${item.price.toFixed(2)}</td>
                <td style="text-align: right;">${lineTotal.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('total-val').innerText = total.toFixed(2);
    }

    // Input-käsittely
    document.getElementById('main-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = e.target.value;
            if (products[val]) {
                cart.push({...products[val], qty: 1, voided: false});
                updateCart();
            }
            e.target.value = '';
        }
    });

    function addProd(code) {
        if (products[code]) {
            cart.push({...products[code], qty: 1, voided: false});
            updateCart();
        }
    }

    function removeLine() {
        let idx = prompt("Monesko rivi poistetaan (1-X)?");
        if (cart[idx-1]) {
            cart[idx-1].voided = true;
            updateCart();
        }
    }

    function voidSale() {
        if(confirm("Tyhjennetäänkö kassa?")) {
            cart = [];
            updateCart();
        }
    }

    function pay(type) {
        alert(type + " suoritettu. Tulostetaan kuitti...");
        cart = [];
        updateCart();
    }

    // Kello
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // Alustus
    updateCart();
</script>

</body>
</html>
