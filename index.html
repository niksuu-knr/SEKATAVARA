<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>JS-Kassa Pro - Keyboard Optimized</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --text: #ffffff;
            --accent: #007acc;
            --danger: #d9534f;
            --success: #5cb85c;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        #pos-container { display: flex; width: 100%; }
        #sidebar { width: 300px; border-right: 2px solid #444; padding: 10px; background: #252526; }
        #main-kassa { flex-grow: 1; display: flex; flex-direction: column; padding: 10px; }
        
        /* Receipt Area */
        #receipt-window {
            flex-grow: 1;
            background: #fff;
            color: #000;
            padding: 20px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            font-size: 1.1rem;
        }

        .receipt-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #ccc; }
        .voided { text-decoration: line-through; color: gray; }

        /* Input Area */
        #input-panel {
            background: #333;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #main-input {
            flex-grow: 1;
            font-size: 2rem;
            background: #000;
            color: #0f0;
            border: 2px solid var(--accent);
            padding: 10px;
            text-transform: uppercase;
        }

        .status-bar { display: flex; justify-content: space-between; padding: 5px; background: #004d40; font-weight: bold; }
        
        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            padding: 30px;
            border: 4px solid var(--accent);
            z-index: 100;
            min-width: 400px;
        }

        .active-modal { display: block; }
        
        .shortcut-hint { font-size: 0.8rem; color: #aaa; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

<!-- HALLINTA-ALUE (Piilotettu oletuksena) -->
<div id="admin-panel" class="modal">
    <h2>HALLINTA</h2>
    <div id="admin-content">
        <button onclick="toggleAdmin()">SULJE (ESC)</button>
        <hr>
        <h3>Tuotteen lisäys</h3>
        <input id="adm-name" placeholder="Nimi">
        <input id="adm-price" placeholder="Hinta">
        <input id="adm-ean" placeholder="EAN/Koodi">
        <button onclick="adminAddProduct()">LISÄÄ</button>
    </div>
</div>

<!-- KASSA-ALUE -->
<div id="pos-container">
    <div id="sidebar">
        <h3>PIKANÄPPÄIMET</h3>
        <ul style="list-style: none; padding: 0;">
            <li><b>F1:</b> Kirjaudu / Ulos</li>
            <li><b>F2:</b> Tuotehaku</li>
            <li><b>F4:</b> Jäsenet</li>
            <li><b>F8:</b> Alennus</li>
            <li><b>F9:</b> MAKSU</li>
            <li><b>ESC:</b> Peruuta</li>
            <li><b>CTRL+A:</b> Hallinta</li>
        </ul>
        <hr>
        <div id="quick-buttons">
            <button onclick="addToCart('001', 1)">MUOVIKASSI (0.40€)</button>
        </div>
    </div>

    <div id="main-kassa">
        <div class="status-bar">
            <span id="stat-user">MYYJÄ: EI KIRJAUTUNUT</span>
            <span id="stat-member">ASIAKAS: Satunnainen</span>
        </div>

        <div id="receipt-window">
            <div style="text-align: center;">
                <strong>*** JS-KASSA PRO ***</strong><br>
                <span id="receipt-date"></span>
            </div>
            <hr>
            <div id="receipt-items">
                <!-- Tuotteet tulevat tähän -->
            </div>
            <hr>
            <div style="font-size: 1.5rem; text-align: right;">
                YHTEENSÄ: <span id="total-sum">0.00</span> €
            </div>
            <div id="change-display" style="color: var(--danger); text-align: right; font-weight: bold;"></div>
        </div>

        <div id="input-panel">
            <span style="font-weight: bold;">SYÖTE:</span>
            <input type="text" id="main-input" autocomplete="off" autofocus>
        </div>
    </div>
</div>

<script>
    // --- DATA & STATE ---
    let db = {
        products: [
            { id: "001", name: "MUOVIKASSI", price: 0.40, ageLimit: 0 },
            { id: "123", name: "KAHVI 500G", price: 5.95, ageLimit: 0 },
            { id: "666", name: "OLUT III", price: 2.50, ageLimit: 18 }
        ],
        members: [{ id: "1001", name: "Matti Meikäläinen", discount: 5 }],
        vouchers: { "999123": 50.00 }
    };

    let cart = [];
    let currentUser = null;
    let currentMember = null;
    let currentInput = "";

    const inputField = document.getElementById('main-input');

    // --- KERNEL LOGIC ---

    inputField.addEventListener('keydown', (e) => {
        if (e.key === "Enter") {
            processInput(inputField.value);
            inputField.value = "";
        }
        
        // Pikanäppäimet
        if (e.key === "F1") loginPrompt();
        if (e.key === "F4") memberPrompt();
        if (e.key === "F8") discountPrompt();
        if (e.key === "F9") paymentPrompt();
        if (e.key === "Delete") voidRow();
        if (e.key === "Escape") { 
            inputField.value = "";
            closeModals();
        }
    });

    function processInput(val) {
        if (!val) return;

        // Tuki kertoimelle: 5*641...
        let qty = 1;
        let code = val;
        if (val.includes('*')) {
            let parts = val.split('*');
            qty = parseFloat(parts[0]);
            code = parts[1];
        }

        // Etsi tuote
        let product = db.products.find(p => p.id === code);
        if (product) {
            addToCart(product.id, qty);
        } else {
            // Jos ei tuotetta, katsotaan onko hinnanmuutos tai manuaalinen hinta
            if (!isNaN(val.replace(',', '.'))) {
                alert("Käytä tuotekoodia tai pikanäppäintä. Manuaalihinta vaatii tuotteen.");
            } else {
                alert("Tuotetta ei löydy!");
            }
        }
    }

    function addToCart(id, qty) {
        let product = db.products.find(p => p.id === id);
        
        // Ikärajatarkistus
        if (product.ageLimit > 0) {
            if (!confirm(`IKÄRAJATARKISTUS: ${product.ageLimit}v?`)) return;
        }

        // Onko jo korissa? (Lisätään samalle riville)
        let existing = cart.find(item => item.id === id && !item.voided);
        if (existing) {
            existing.qty += qty;
        } else {
            cart.push({ ...product, qty: qty, voided: false, discount: 0 });
        }
        renderReceipt();
    }

    function voidRow() {
        let index = prompt("Minkä rivin haluat poistaa? (1, 2...)");
        if (cart[index - 1]) {
            cart[index - 1].voided = true;
            renderReceipt();
        }
    }

    function renderReceipt() {
        const container = document.getElementById('receipt-items');
        container.innerHTML = "";
        let total = 0;

        cart.forEach((item, index) => {
            let rowTotal = (item.price * item.qty) - (item.discount || 0);
            if (!item.voided) total += rowTotal;

            const div = document.createElement('div');
            div.className = `receipt-row ${item.voided ? 'voided' : ''}`;
            div.innerHTML = `
                <span>${index + 1}. ${item.qty}x ${item.name}</span>
                <span>${rowTotal.toFixed(2)}€</span>
            `;
            container.appendChild(div);
        });

        // Pyöristys (0.05)
        let rounded = Math.round(total * 20) / 20;
        document.getElementById('total-sum').innerText = rounded.toFixed(2);
    }

    function paymentPrompt() {
        let total = parseFloat(document.getElementById('total-sum').innerText);
        if (total <= 0) return;

        let method = prompt("MAKSUTAPA: 1. Käteinen, 2. Kortti, 3. Lahjakortti");
        
        if (method === "1") {
            let given = parseFloat(prompt("Saatu käteinen:"));
            let change = given - total;
            document.getElementById('change-display').innerText = `VAIHTORAHAA: ${change.toFixed(2)} €`;
            finalizeSale();
        } else if (method === "2") {
            alert("Odotetaan maksupäätettä... [SIMULAATIO]");
            setTimeout(() => { alert("MAKSU HYVÄKSYTTY"); finalizeSale(); }, 1500);
        } else if (method === "3") {
            let vCode = prompt("Anna lahjakortin numero:");
            if (db.vouchers[vCode]) {
                alert(`Saldo: ${db.vouchers[vCode]}€. Käytetään...`);
                finalizeSale();
            } else {
                alert("Lahjakorttia ei löydy.");
            }
        }
    }

    function finalizeSale() {
        alert("Kuitti tulostettu. Kauppa valmis.");
        cart = [];
        currentMember = null;
        document.getElementById('stat-member').innerText = "ASIAKAS: Satunnainen";
        renderReceipt();
    }

    // --- HALLINTA JA MUUT ---
    function loginPrompt() {
        let pin = prompt("Syötä myyjä-PIN (esim. 1234):");
        if (pin === "1234") {
            currentUser = "Matti Myyjä";
            document.getElementById('stat-user').innerText = "MYYJÄ: " + currentUser;
        }
    }

    function memberPrompt() {
        let mid = prompt("Jäsennumero tai Nimi (Uusi jäsen kirjoittamalla 'UUSI'):");
        if (mid === "UUSI") {
            let n = prompt("Nimi:");
            let nid = Date.now().toString().slice(-4);
            db.members.push({id: nid, name: n, discount: 0});
            alert("Luotu: " + nid);
        } else {
            let m = db.members.find(x => x.id === mid || x.name.includes(mid));
            if (m) {
                currentMember = m;
                document.getElementById('stat-member').innerText = "ASIAKAS: " + m.name;
            }
        }
    }

    function toggleAdmin() {
        document.getElementById('admin-panel').classList.toggle('active-modal');
    }

    // Näppäinyhdistelmä hallintaan (Ctrl + A)
    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'a') {
            e.preventDefault();
            toggleAdmin();
        }
    });

    function closeModals() {
        document.getElementById('admin-panel').classList.remove('active-modal');
    }

    // Kellonaika kuitille
    setInterval(() => {
        document.getElementById('receipt-date').innerText = new Date().toLocaleString();
    }, 1000);

</script>
</body>
</html>
